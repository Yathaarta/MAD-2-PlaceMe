<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 38" fill="none" height="38">
  <defs>
    <!-- Define the Blue-Green Gradient -->
    <linearGradient id="ladderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" /> <!-- Blue -->
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" /> <!-- Emerald Green -->
    </linearGradient>
  </defs>

  <!-- Step 1: Software Solution (Blue) -->
  <text x="0" y="14" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#2563eb" letter-spacing="0.5">
    Software Solution for
  </text>

  <!-- Step 2: For Campus Placement (Blue-Green Mix) -->
  <text x="25" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#278e6c" letter-spacing="0.5">
    Campus Placement
  </text>

  <!-- Step 3: Management (Green) -->
  <text x="139" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#237d5f" letter-spacing="0.5">
    Management
  </text>
  
</svg>